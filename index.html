<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            Registro de la persona Usuaria
        </title>
        <link rel="stylesheet" href="estilosformu.css">
    </head>
        <body>
    <h1 id="Titulo-principal"> Registro de la persona Usuaria </h1>

    <form action="/login.php" method="post">
        <div class="Campos-de-texto">

        <label for="user">Usuario:</label>
        <input id="user" name="user" type="text" required>

        
        <label for="nombre">Nombre(s):</label>
        <input id="nombre" name="nombre" type="text" required>

        
        <label for="apellido">Apellido(s):</label>
        <input id="apellido" name="apellido" type="text" required>

        
    </div>

    <div class="Correo">

        <label for="email">Correo Electrónico:</label>
        <input id="email" name="email" type="email" required>

    </div>
    
    <div class="Contraseña">

        <label for="password">Contraseña:</label>
        <input id="password" name="password" type="password" required>
        
    </div>

    <div class="Descripción">

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="5" cols="60" placeholder="Escribe aquí una breve descripción de ti mismo..."></textarea>

    </div>

    <div class="Opciones">

        <p>Opciones de interes:</p>

        <input type="checkbox" id="tec" name="intereses[]" value="tecnologia">
        <label for="tec">Tecnología</label>
            
        <input type="checkbox" id="arte" name="intereses[]" value="arte">
        <label for="arte">Arte</label>
            
        <input type="checkbox" id="deporte" name="intereses[]" value="deporte">
        <label for="deporte">Deporte</label>
            
        <input type="checkbox" id="musica" name="intereses[]" value="musica">
        <label for="musica">Música</label>
            
        <input type="checkbox" id="lectura" name="intereses[]" value="lectura">
        <label for="lectura">Lectura</label>
            
        <input type="checkbox" id="gaming" name="intereses[]" value="gaming">
        <label for="gaming">Gaming</label>
        
    </div>

    <div class="Registro">

        <input type="submit" value="Registrarse">
    
    </div>
    </form>

</body>
</html>
